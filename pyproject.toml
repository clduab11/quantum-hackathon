[project]
name = "quantum-hackathon"
version = "0.1.0"
description = "Praxen's entry to the Google Quantum AI Verifiable Quantum Circuit Compilation Kaggle competition"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
]
notebooks = [
    "ipykernel",
    "nbclient",
    "nbformat",
]
search = [
    "openevolve==0.4.0",
]

[tool.uv]
package = false
# The search loop (search/) needs openevolve; make it a default group so a plain `uv sync` or
# `uv run pytest` never prunes it from the venv while a loop is running.
default-groups = ["dev", "search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
