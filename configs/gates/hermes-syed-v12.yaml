# Hermes candidate: stage the pinned Apache-2.0 syed3000 v12 portfolio (D-HERMES-20261112-02).
# 17 circuits are declared inputs of kind vendored_circuit under D-PRA341-01; G5 passes each only
# when the shipped file is byte-identical to its pin. The dfthcsos factor .npz is a declared
# non-circuit input (D-PRA211-05). Nothing here is an own-generator claim. The author's
# "100% original" statement is the author's claim and is not certified by this repository.
# No gate is waived and G0, G3 and G5 are the unchanged accepted checks. The only new hooks are
# the invsqrt G1/G2 below (46-qubit bound, same bounded spec as pra325). dqi and dfthcsos reuse
# the existing hooks. G4 is the unchanged strict-improvement check.
# Provenance: ledger/evidence/hermes-syed-v12/provenance.md. Pins: tasks/public_portfolio/SOURCE.json.
schema: 1
salt_label: PRA171_LOCAL_PUBLIC_FIXED_SALT_0001
gates:
- id: G0
  name: pre-flight (metric-only file checks, no simulation)
  check: ledger.gates.checks:g0_preflight
  waivable: false
  params:
    hook: ledger.gates.g0_preflight:preflight
- id: G1
  name: smoke on small instances
  check: ledger.gates.checks:per_task
  waivable: false
  params:
    hooks:
      invsqrt: tasks.public_portfolio.gates:g1_invsqrt
      dqi: tasks.dqi.gates:g1_smoke
      dfthcsos: tasks.dfthcsos.gates:g1_smoke
- id: G2
  name: fast proxy
  check: ledger.gates.checks:per_task
  waivable: false
  params:
    hooks:
      invsqrt: tasks.public_portfolio.gates:g2_invsqrt
      dqi: tasks.dqi.gates:g2_proxy
      dfthcsos: tasks.dfthcsos.gates:g2_proxy
- id: G3
  name: full local verifier
  check: ledger.gates.checks:g3_full_verifier
  waivable: false
  params:
    hook: harness.score_local:score_submission
    expected_shots:
      invsqrt: 200540928
      dqi: 102400
      dfthcsos: 78080
- id: G4
  name: strict improvement over parent and archive
  check: ledger.gates.checks:g4_strict_improvement
  waivable: false
- id: G5
  name: byte-identical rebuild from a clean worktree + provenance
  check: ledger.gates.checks:g5_rebuild_and_provenance
  waivable: false
  params:
    timeout_seconds: 7200
generators:
  invsqrt:
  - '{python}'
  - -m
  - tasks.public_portfolio.generate
  - --task
  - invsqrt
  - --out
  - '{out}'
  dqi:
  - '{python}'
  - -m
  - tasks.public_portfolio.generate
  - --task
  - dqi
  - --out
  - '{out}'
  dfthcsos:
  - '{python}'
  - -m
  - tasks.public_portfolio.generate
  - --task
  - dfthcsos
  - --out
  - '{out}'
