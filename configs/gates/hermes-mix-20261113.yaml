# Hermes candidate hermes-mix-20261113: a three-source public mix (D-HERMES-20261113-01).
# invsqrt from ahoirg V25, dqi from areebbb V8, dfthcsos (angles + factor) from atakanaldemir V19,
# all Apache-2.0 Kaggle notebooks pinned by URL, version and SHA-256 in
# tasks/public_portfolio/MIX-20261113.json. 17 circuits are vendored_circuit inputs (D-PRA341-01);
# G5 passes each only when the shipped file is byte-identical to its pin. The factor .npz is a
# declared non-circuit input (D-PRA211-05). Nothing here is an own-generator claim.
# G0, G3, G4 and G5 are byte-for-byte the hermes-syed-v12 gates; no gate is waived. The only
# change is the invsqrt G1/G2 hook, which checks the mix pin instead of the v12 pin.
# Provenance: ledger/evidence/hermes-mix-20261113/provenance.md.
schema: 1
salt_label: PRA171_LOCAL_PUBLIC_FIXED_SALT_0001
gates:
- id: G0
  name: pre-flight (metric-only file checks, no simulation)
  check: ledger.gates.checks:g0_preflight
  waivable: false
  params:
    hook: ledger.gates.g0_preflight:preflight
- id: G1
  name: smoke on small instances
  check: ledger.gates.checks:per_task
  waivable: false
  params:
    hooks:
      invsqrt: tasks.public_portfolio.gates:g1_mix_invsqrt
      dqi: tasks.dqi.gates:g1_smoke
      dfthcsos: tasks.dfthcsos.gates:g1_smoke
- id: G2
  name: fast proxy
  check: ledger.gates.checks:per_task
  waivable: false
  params:
    hooks:
      invsqrt: tasks.public_portfolio.gates:g2_mix_invsqrt
      dqi: tasks.dqi.gates:g2_proxy
      dfthcsos: tasks.dfthcsos.gates:g2_proxy
- id: G3
  name: full local verifier
  check: ledger.gates.checks:g3_full_verifier
  waivable: false
  params:
    hook: harness.score_local:score_submission
    expected_shots:
      invsqrt: 200540928
      dqi: 102400
      dfthcsos: 78080
- id: G4
  name: strict improvement over parent and archive
  check: ledger.gates.checks:g4_strict_improvement
  waivable: false
- id: G5
  name: byte-identical rebuild from a clean worktree + provenance
  check: ledger.gates.checks:g5_rebuild_and_provenance
  waivable: false
  params:
    timeout_seconds: 7200
generators:
  invsqrt:
  - '{python}'
  - -m
  - tasks.public_portfolio.generate
  - --pin
  - MIX-20261113.json
  - --task
  - invsqrt
  - --out
  - '{out}'
  dqi:
  - '{python}'
  - -m
  - tasks.public_portfolio.generate
  - --pin
  - MIX-20261113.json
  - --task
  - dqi
  - --out
  - '{out}'
  dfthcsos:
  - '{python}'
  - -m
  - tasks.public_portfolio.generate
  - --pin
  - MIX-20261113.json
  - --task
  - dfthcsos
  - --out
  - '{out}'
