# Gate pipeline for the reference submission only (PRA-178; G5 repaired by PRA-211). Identical to
# default.yaml: G1, G2 and G4 are waived with a written reason because the reference circuits
# are Google's and are not meant to improve on anything, and G5 is the same check as for a
# Praxen candidate. Every file is rebuilt in a clean worktree from the committed generators
# below with only the declared `inputs` visible, and compared byte for byte with the manifest.
# A generator output that is a byte copy of a competition-package circuit fails G5 (R10; Chris's
# ruling on PRA-169, 2026-10-25: "build it from source"; D-PRA211-01); a declared non-circuit
# input copied into the zip is recorded, not failed (Chris's ruling on PRA-211; D-PRA211-05). The
# copier ledger/examples/reference_generator.py that cleared G5 for submission-001 is retired.
# Never use this config for a Praxen candidate.
#
# The gates run in this order and the order is enforced: a gate runs only when every earlier gate
# is cleared (PASS, or WAIVED where waivable) on the same zip SHA-256. G0, G3 and G5 can never be
# waived. A hook that is not installed is a FAIL, never a skip.
#
# Hooks are "module:function". Owners:
#   ledger.gates.g0_preflight     P0-4 (PRA-174, aurelio)
#   harness.score_local           P0-4 (PRA-174, aurelio)
#   tasks.<task>.gates            the generator owner: P0-6 (invsqrt), P0-7 (dqi, dfthcsos)

schema: 1

# Fixed public local salt (the same label as the PRA-171 inventory recipe). Kaggle's salts are
# secret; no seed or salt grinding (AGENTS.md).
salt_label: PRA171_LOCAL_PUBLIC_FIXED_SALT_0001

gates:
  - id: G0
    name: pre-flight (metric-only file checks, no simulation)
    check: ledger.gates.checks:g0_preflight
    waivable: false
    params:
      hook: ledger.gates.g0_preflight:preflight

  - id: G1
    name: smoke on small instances
    check: ledger.gates.checks:per_task
    waivable: true
    params:
      hooks:
        invsqrt: tasks.invsqrt.gates:g1_smoke
        dqi: tasks.dqi.gates:g1_smoke
        dfthcsos: tasks.dfthcsos.gates:g1_smoke

  - id: G2
    name: fast proxy
    check: ledger.gates.checks:per_task
    waivable: true
    params:
      hooks:
        # Exhaustive numpy integer mirror over all 3,133,452 inputs.
        invsqrt: tasks.invsqrt.gates:g2_proxy
        # Subsampled shots (shot_divisor > 1). Never reported as parity.
        dqi: tasks.dqi.gates:g2_proxy
        # heuristic_costs plus the error <= 20 mHa, Lambda > 49.0, E_gap > 3.914898 Ha checks.
        dfthcsos: tasks.dfthcsos.gates:g2_proxy

  - id: G3
    name: full local verifier
    check: ledger.gates.checks:g3_full_verifier
    waivable: false
    params:
      hook: harness.score_local:score_submission
      expected_shots:
        invsqrt: 200540928
        dqi: 102400
        dfthcsos: 254464

  - id: G4
    name: strict improvement over parent and archive
    check: ledger.gates.checks:g4_strict_improvement
    # Waivable only for pipeline checks that are not meant to improve (e.g. the reference zip).
    waivable: true

  - id: G5
    name: byte-identical rebuild from a clean worktree + provenance
    check: ledger.gates.checks:g5_rebuild_and_provenance
    waivable: false
    params:
      timeout_seconds: 7200

# G5 generator commands: committed builders only. tasks/invsqrt/reference.py and
# tasks/dqi/generate.py are attributed ports of the package's reference circuit scripts;
# tasks/dfthcsos/generate.py rebuilds the ten ANGLE circuits from the declared factorization.
generators:
  invsqrt: ["{python}", "tasks/invsqrt/reference.py", "--out", "{out}"]
  dqi: ["{python}", "tasks/dqi/generate.py", "--out", "{out}"]
  dfthcsos: ["{python}", "tasks/dfthcsos/generate.py", "--out", "{out}"]

# Declared competition-package inputs, relative to the package root and SHA-256 pinned. G5 stages
# exactly these files into an otherwise empty VQCC_DATA for the generators, so nothing else from
# the package can be read or copied. A circuit (.kmb) can never be declared here (R10). An output
# byte-identical to a declared input is recorded per task as `copied`; the factorization below is
# the one input that may ship as a recorded copy (Chris's ruling on PRA-211; D-PRA211-05).
inputs:
  dfthcsos:
    - path: sample_submission/dfthcsos/submission.npz
      sha256: 14d5cc25eb3bf82a9ccb87c811db28d127bef6d28697dd190dc1e875de3bfe69
