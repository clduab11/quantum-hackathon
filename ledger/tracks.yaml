# The four programme tracks and their verified numbers (PRA-252), shown on the status page.
#
# Read by the status page (ledger/status_page.py) and nothing else; the schema is in
# docs/ledger-schema.md. The engineers and john-wick update a track's block the day a number is
# verified, and bump its updated_at_utc. Keep one blank line between tracks, so two people who
# edit different tracks never touch neighbouring lines.
#
# Every value is a per-circuit score ratio (reference cost / our cost) measured with Google's
# verifier, never a model or an estimate. "shipped": in our latest upload. "verified": passed the
# verifier, not uploaded. "in work": no measured number yet, so no value.
#
# The page shows this text to readers who know nothing about the project: plain English, no
# ticket ids, no ledger words.

schema: 1

tracks:
  - id: A
    name: Ship lane
    aim: >-
      Upload only circuits that pass every check, and rebuild the best public designs in our own
      code.
