# Our public standing on the Kaggle leaderboard, as john-wick last read it (PRA-241).
#
# Read by the status page (ledger/status_page.py) and nothing else. Update the leaderboard block
# with every `leaderboard-snapshot`, and add a one-line note for every new submission. Our own
# scores are not here: the public score comes from ledger/evidence/<submission>/
# kaggle-public-score.json and the per-task ratios from the submission manifests.
#
# The page shows these notes and numbers to readers who know nothing about the project: plain
# English, no ticket ids, no ledger words.

schema: 1

leaderboard:
  # PRA-202 `leaderboard-snapshot` revision 9: the full CSV (publicleaderboard-2026-10-26T18:51:02.csv,
  # 1132 rows), taken with the submission-006 score read-back (D-PRA202-26).
  read_at_utc: "2026-10-26T18:51:02+00:00"
  our_score: 11.30048         # our public score when the rank was read
  rank: 523
  teams: 1132
  leader_score: 23.35228
  prize_line_place: 6         # last paid place (D-PRA202-14)
  prize_line_score: 20.40926

best_public_per_task:
  # Kaggle publishes no per-task scores; these are the best figures authors state in public
  # notebooks, so they are a floor on the true best, not the true best. Refreshed 2026-10-26 from
  # the sources already in the ledger (no new Kaggle read):
  #   invsqrt 15.69: busyaprime notebook v5, stated, not verified by us (D-PRA202-19).
  #   dqi 48.79: the public Schur circuit (alexchilton, read 2026-10-26 17:20-17:35Z), stated.
  #     It counts as a stated public figure; our own run of that circuit at our fixed salt
  #     measured 48.14x (D-PRA269-02).
  #   dfthcsos 4.09: Gluzdov v8, stated; unchanged since the 2026-10-25 read (revision 4).
  read_at_utc: "2026-10-26T17:35:00+00:00"
  invsqrt: 15.69
  dqi: 48.79
  dfthcsos: 4.09

submission_notes:
  submission-001: The unchanged reference circuits, to prove our upload pipeline end to end.
  submission-002: A cheaper error-correcting decoder (dqi); the other two circuits unchanged.
  submission-003: Adds a cheaper square-root circuit (invsqrt) to the new decoder.
  submission-004: A smaller decoder circuit (dqi) that needs fewer qubits; the other two circuits unchanged.
  submission-005: A much cheaper chemistry circuit (dfthcsos); the other two circuits unchanged.
  submission-006: A cheaper decoder circuit (dqi) rebuilt from the best public design; the other two circuits unchanged.

# The public Kaggle notebook, once it is published. null hides the link.
notebook_url: null
