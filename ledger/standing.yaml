  # own read of team "Chris Dukes" that day; our best public entry is still submission-013
  # (27.28993). Top of the board: #1 Cat with 2 Qubits 34.50408, #6 yu4u 33.53418, #17 33.32083
  # (last gold). Prior standing was the 2026-11-13 21:54:55Z read (rank 140 of 3002 at 27.28993;
  # #1 29.90871; #6 28.56411).
  read_at_utc: "2026-11-26T21:58:00+00:00"
  our_score: 27.28993         # our public score when the rank was read
  rank: 1888
  teams: 3784
  leader_score: 34.50408
  prize_line_place: 6         # last paid place (D-PRA202-14)
  prize_line_score: 33.53418

